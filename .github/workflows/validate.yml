name: validate

# Same posture as household-state's: a repo that only validates on push goes
# quietly stale between commits, and these repos sit untouched for months.

on:
  push:
    branches: [master]
  pull_request:
  schedule:
    - cron: "0 7 * * 2"
  workflow_dispatch:

env:
  DOMAIN: house_cleaning

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

jobs:
  # hassfest, hacs and the shared tests/imports jobs run in
  # jrackerby/gha-workflows validate-integration.yml (workflow_call);
  # master's required contexts are "validate / <job>" (jrackerby/HA#821).
  validate:
    uses: jrackerby/gha-workflows/.github/workflows/validate-integration.yml@master
    with:
      domain: "house_cleaning"
      public: true
      test-command: "./tools/run_tests.sh -q"

  e2e:
    # THE REAL LAYOUT AGAINST REAL CORE, with entities, flows and actions
    # exercised -- not just imported. Same interpreter rule as `imports`.
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - uses: astral-sh/setup-uv@v5
      - name: run tests/e2e against the core version hacs.json claims
        run: ./tools/run_e2e.sh -q
      - name: assert the suite is not empty
        run: |
          COUNT=$(cd tests/e2e && ../../.venv-e2e/bin/python -m pytest --collect-only -q -p no:cacheprovider 2>/dev/null | grep -c '::' || true)
          test "$COUNT" -gt 0 \
            || { echo "CANNOT RUN: zero e2e tests collected -- the step above passed vacuously"; exit 1; }
          echo "collected $COUNT e2e tests"
